[package]
name = "rustgis-assistant"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RustGIS L5: the AI assistant — a chat agent that drives the session through commands, over OpenAI-compatible, Anthropic and Gemini APIs"

[lints]
workspace = true

[dependencies]
rustgis-engine = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
log = { workspace = true }

# Calling the model on the desktop and the command line. The browser calls it with its own fetch
# (the web app's `Services::http`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
getrandom = "0.3"

# The relay's token folder and file must belong to the user running the process.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }
